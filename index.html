<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Road Viewer - Auto Simulation</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js" crossorigin="anonymous"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/eruda" crossorigin="anonymous"></script>
    <script>eruda.init();</script>

    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; background: rgba(0,0,0,0.8); color: #fff; padding: 15px; border-bottom: 2px solid #27ae60; }
        select, button { font-size: 14px; padding: 10px; margin-top: 5px; width: 100%; border-radius: 6px; border: none; }
        button { background: #27ae60; color: white; font-weight: bold; cursor: pointer; }
        #msg { margin-top: 8px; white-space: pre-line; color: #00ff00; font-family: monospace; font-size: 11px; }
    </style>
</head>

<body>
<div id="ui">
    <b>📍 ระบบ AR ถนน (โหมดจำลองตำแหน่งอัตโนมัติ)</b><br/>
    <select id="dataset">
        <option value="roads_ar_points_อำเภอเมืองอุทัยธานี.geojson">อำเภอเมืองอุทัยธานี (ค่าเริ่มต้น)</option>
        <option value="roads_ar_points_อำเภอหนองฉาง.geojson">อำเภอหนองฉาง</option>
        <option value="roads_ar_points_อำเภอทัพทัน.geojson">อำเภอทัพทัน</option>
        <option value="roads_ar_points_อำเภอบ้านไร่.geojson">อำเภอบ้านไร่</option>
    </select>
    <button id="load">🚀 โหลดข้อมูลอำเภอที่เลือก</button>
    <div id="msg">กำลังเตรียมระบบจำลองพิกัด...</div>
</div>

<a-scene
    embedded
    vr-mode-ui="enabled:false"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
>
    <a-box position="0 1.5 -5" material="color: purple; opacity: 0.8" scale="0.5 0.5 0.5"></a-box>
    
    <a-entity id="main-camera" 
              gps-camera="simulateLatitude: 15.36257; simulateLongitude: 100.01436;" 
              rotation-reader>
    </a-entity>
    
    <a-entity id="root"></a-entity>
</a-scene>

<script>
const ROAD_WIDTH = 0.6;   
const ROAD_HEIGHT = 0.1;  
const MAX_DRAW_DIST = 1500; 

const root = document.getElementById("root");
const msg = document.getElementById("msg");
let simLat = 15.36257, simLon = 100.01436;

// แสดงสถานะจำลองพิกัด
msg.textContent = `⚠️ โหมดจำลองพิกัด: อุทัยธานี\nพิกัด: ${simLat}, ${simLon}\n(กรุณากดปุ่มโหลดข้อมูล)`;

function distMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
}

function bearingDeg(lat1, lon1, lat2, lon2) {
    const toRad = d => d * Math.PI / 180;
    const toDeg = r => r * 180 / Math.PI;
    const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
    const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2-lon1));
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

function addRoadSegment(lat1, lon1, lat2, lon2) {
    const midLat = (lat1 + lat2) / 2;
    const midLon = (lon1 + lon2) / 2;
    const length = distMeters(lat1, lon1, lat2, lon2);
    const angle = bearingDeg(lat1, lon1, lat2, lon2);

    if (length > 200) return; 

    const entity = document.createElement("a-entity");
    entity.setAttribute("gps-entity-place", `latitude: ${midLat.toFixed(7)}; longitude: ${midLon.toFixed(7)};`);

    const plane = document.createElement("a-plane");
    plane.setAttribute("width", ROAD_WIDTH);
    plane.setAttribute("height", length);
    plane.setAttribute("color", "#f1c40f");
    plane.setAttribute("rotation", "-90 " + angle + " 0");
    plane.setAttribute("position", `0 ${ROAD_HEIGHT} 0`);
    plane.setAttribute("material", "shader: flat; side: double;");

    entity.appendChild(plane);
    root.appendChild(entity);
}

async function loadData(filename) {
    root.innerHTML = ""; 
    msg.textContent = `กำลังดึงข้อมูลจาก ./data/${filename}...`;

    try {
        const url = `./data/${encodeURIComponent(filename)}`;
        const res = await fetch(url);
        
        if (!res.ok) throw new Error(`ไม่พบไฟล์ที่ ./data/${filename}`);
        
        const data = await res.json();
        const features = data.features || [];
        
        const byRoad = new Map();
        features.forEach(f => {
            if (f.geometry && f.geometry.coordinates) {
                const [lon, lat] = f.geometry.coordinates;
                const p = f.properties || {};
                const key = p.road_key || p.road_name || "default";
                if (!byRoad.has(key)) byRoad.set(key, []);
                byRoad.get(key).push({lat, lon, pt_i: Number(p.pt_i || 0)});
            }
        });

        let count = 0;
        byRoad.forEach(pts => {
            pts.sort((a, b) => a.pt_i - b.pt_i);
            for (let i = 0; i < pts.length - 1; i++) {
                // คำนวณระยะห่างจากพิกัดจำลอง
                const d = distMeters(simLat, simLon, pts[i].lat, pts[i].lon);
                if (d < MAX_DRAW_DIST) {
                    addRoadSegment(pts[i].lat, pts[i].lon, pts[i+1].lat, pts[i+1].lon);
                    count++;
                }
            }
        });
        msg.textContent = `✅ โหลดสำเร็จ: วาดถนนแล้ว ${count} ช่วง\nรัศมีการค้นหา: ${MAX_DRAW_DIST} เมตร`;
    } catch (err) {
        msg.textContent = `❌ Error: ${err.message}`;
        console.error("Fetch Error:", err);
    }
}

document.getElementById("load").onclick = () => {
    const f = document.getElementById("dataset").value;
    if (f) loadData(f);
};
</script>
</body>
</html>
