<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Road Project - Uthai Thani</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js" crossorigin="anonymous"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui { position: fixed; top: 10px; left: 10px; right: 10px; z-index: 9999; background: rgba(0,0,0,.8); color: #fff; padding: 12px; border-radius: 10px; font-size: 14px; }
        select, button { font-size: 14px; padding: 10px; margin-top: 5px; width: 100%; border-radius: 6px; border: none; }
        button { background: #3498db; color: white; font-weight: bold; }
        #msg { margin-top: 8px; white-space: pre-line; color: #00ff00; font-family: monospace; font-size: 11px; }
    </style>
</head>

<body>
<div id="ui">
    <b>📍 ระบบ AR ถนน (เวอร์ชันแก้ปัญหา Script Error)</b><br/>
    <select id="dataset">
        <option value="">-- เลือกอำเภอ --</option>
        <option value="roads_ar_points_อำเภอเมืองอุทัยธานี.geojson">อำเภอเมืองอุทัยธานี</option>
        <option value="roads_ar_points_อำเภอหนองฉาง.geojson">อำเภอหนองฉาง</option>
        <option value="roads_ar_points_อำเภอทัพทัน.geojson">อำเภอทัพทัน</option>
        <option value="roads_ar_points_อำเภอหนองขาหย่าง.geojson">อำเภอหนองขาหย่าง</option>
    </select>
    <button id="load">🚀 แสดงผลถนน AR</button>
    <button style="background:#e67e22;" id="simulate">🏠 จำลองตำแหน่ง (เมืองอุทัยฯ)</button>
    <div id="msg">รอสัญญาณ GPS...</div>
</div>

<a-scene
    embedded
    vr-mode-ui="enabled:false"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false; trackingMethod: best;"
>
    <a-box position="0 1 -3" color="purple" scale="0.3 0.3 0.3"></a-box>
    
    <a-entity id="main-camera" gps-camera="enableHighAccuracy: true;" rotation-reader></a-entity>
    <a-entity id="root"></a-entity>
</a-scene>

<script>
// ปรับค่าความหนาและความสูงใหม่เพื่อลดความบิดเบี้ยว
const SEG_THICK = 0.3;   // ลดความหนาลงเพื่อให้ดูเป็นเส้นถนน
const SEG_HEIGHT = 0.05;  // วางเกือบติดพื้นเพื่อลดอาการลอยบังจอ
const MAX_RADIUS_M = 800; // ลดรัศมีลงเหลือ 800 เมตร เพื่อลดภาระการประมวลผล

const root = document.getElementById("root");
const msg = document.getElementById("msg");
let userLat = null, userLon = null;

navigator.geolocation.watchPosition((pos) => {
    userLat = pos.coords.latitude;
    userLon = pos.coords.longitude;
    msg.textContent = `GPS: ${userLat.toFixed(5)}, ${userLon.toFixed(5)} (±${Math.round(pos.coords.accuracy)}m)`;
}, (err) => {
    msg.textContent = `❌ GPS Error: ${err.message}`;
}, { enableHighAccuracy: true });

function distMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
}

function bearingDeg(lat1, lon1, lat2, lon2) {
    const toRad = d => d * Math.PI / 180;
    const toDeg = r => r * 180 / Math.PI;
    const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
    const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2-lon1));
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

async function loadData(filename) {
    if (!userLat) return;
    root.innerHTML = ""; 
    msg.textContent = "กำลังโหลดข้อมูล...";

    try {
        const url = `./data/${encodeURIComponent(filename)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("ไม่พบไฟล์ใน /data");
        const data = await res.json();
        
        const byRoad = new Map();
        data.features.forEach(f => {
            const [lon, lat] = f.geometry.coordinates;
            const p = f.properties || {};
            const key = p.road_key || p.road_name || "road";
            if (!byRoad.has(key)) byRoad.set(key, []);
            byRoad.get(key).push({lat, lon, pt_i: Number(p.pt_i || 0)});
        });

        let count = 0;
        byRoad.forEach(pts => {
            pts.sort((a, b) => a.pt_i - b.pt_i);
            for (let i = 0; i < pts.length - 1; i++) {
                const d = distMeters(userLat, userLon, pts[i].lat, pts[i].lon);
                if (d < MAX_RADIUS_M) {
                    const midLat = (pts[i].lat + pts[i+1].lat) / 2;
                    const midLon = (pts[i].lon + pts[i+1].lon) / 2;
                    const len = distMeters(pts[i].lat, pts[i].lon, pts[i+1].lat, pts[i+1].lon);
                    const brg = bearingDeg(pts[i].lat, pts[i].lon, pts[i+1].lat, pts[i+1].lon);

                    const el = document.createElement("a-entity");
                    el.setAttribute("gps-entity-place", `latitude: ${midLat.toFixed(7)}; longitude: ${midLon.toFixed(7)};`);
                    
                    // ปรับการเรนเดอร์ให้เป็นเส้นราบไปกับพื้น (Flat)
                    const line = document.createElement("a-plane");
                    line.setAttribute("width", SEG_THICK);
                    line.setAttribute("height", len); 
                    line.setAttribute("position", `0 0.1 0`); // ยกจากพื้นเล็กน้อย
                    line.setAttribute("rotation", `-90 ${brg} 0`); // นอนราบไปกับพื้น
                    line.setAttribute("color", "yellow");
                    line.setAttribute("material", "side: double;");
                    
                    el.appendChild(line);
                    root.appendChild(el);
                    count++;
                }
            }
        });
        msg.textContent = `✅ สำเร็จ: แสดงถนน ${count} ช่วง`;
    } catch (err) {
        msg.textContent = `❌ Error: ${err.message}`;
    }
}

document.getElementById("load").onclick = () => {
    const f = document.getElementById("dataset").value;
    if (f) loadData(f);
};

document.getElementById("simulate").onclick = () => {
    userLat = 15.36257; userLon = 100.01436;
    const cam = document.getElementById("main-camera");
    cam.setAttribute("gps-camera", `simulateLatitude: ${userLat}; simulateLongitude: ${userLon};`);
    msg.textContent = "⚠️ จำลองตำแหน่ง: เมืองอุทัยธานี";
};
</script>
</body>
</html>
