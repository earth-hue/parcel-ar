<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AR ถนนตามอำเภอ (เส้นถนน - FIX GPS PLACE)</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>

<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
  }
  a-scene {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }
  #ui {
    position: fixed;
    top: 10px; left: 10px; right: 10px;
    z-index: 9999;
    background: rgba(0,0,0,.70);
    color: #fff;
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.4;
  }
  #ui select, #ui button {
    font-size: 14px;
    padding: 6px 10px;
    margin-top: 6px;
  }
  #msg { margin-top: 6px; white-space: pre-line; }
</style>
</head>

<body>

<div id="ui">
  <b>โหมด AR ถนนตามอำเภอ (DEBUG)</b><br/>
  เลือกอำเภอ/ชุดข้อมูล:
  <br/>
  <select id="dataset">
    <option value="">-- เลือก --</option>

    <!-- อำเภอหลัก (ตามไฟล์คุณ) -->
    <option value="roads_ar_points_อำเภอเมืองอุทัยธานี.geojson">อำเภอเมืองอุทัยธานี</option>
    <option value="roads_ar_points_อำเภอบ้านไร่.geojson">อำเภอบ้านไร่</option>
    <option value="roads_ar_points_อำเภอหนองฉาง.geojson">อำเภอหนองฉาง</option>
    <option value="roads_ar_points_อำเภอลานสัก.geojson">อำเภอลานสัก</option>
    <option value="roads_ar_points_อำเภอทัพทัน.geojson">อำเภอทัพทัน</option>
    <option value="roads_ar_points_อำเภอสว่างอารมณ์.geojson">อำเภอสว่างอารมณ์</option>
    <option value="roads_ar_points_อำเภอห้วยคต.geojson">อำเภอห้วยคต</option>
    <option value="roads_ar_points_อำเภอหนองขาหย่าง.geojson">อำเภอหนองขาหย่าง</option>

    <!-- ชุดหลุด (ถ้าอยู่ใน data/) -->
    <option value="roads_ar_points_หนองขาหย่าง.geojson">หนองขาหย่าง (ชุดสั้น)</option>
    <option value="roads_ar_points_หนองฉาง.geojson">หนองฉาง (ชุดสั้น)</option>
    <option value="roads_ar_points_อำเภอเมือง.geojson">อำเภอเมือง (ชุดสั้น)</option>
    <option value="roads_ar_points_เมือง.geojson">เมือง (ชุดสั้น)</option>
    <option value="roads_ar_points_จังหวัดสุพรรณบุรี.geojson">จังหวัดสุพรรณบุรี (ชุดหลุด)</option>
  </select>
  <br/>
  <button id="load">โหลดถนน</button>
  <button id="clear">ล้าง</button>

  <div id="msg">รออนุญาต Camera / Location…</div>
</div>

<!-- ✅ ไม่ใช้ rotation-reader เพื่อลด compass jitter -->
<a-scene
  embedded
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled: true"
  arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
>
  <a-entity gps-camera></a-entity>
  <a-entity id="root"></a-entity>
</a-scene>

<script>
/* =======================
   CONFIG
======================= */
const SEG_THICK    = 0.20;
const SEG_HEIGHT   = 0.35;   // ยกเส้นขึ้นจากพื้น
const DRAW_EVERY   = 3;      // เว้นจุด ลดทับซ้อน
const MAX_RADIUS_M = 1500;   // วาดเฉพาะรอบตัว
const MAX_SEGMENTS = 900;    // จำกัดจำนวนเส้นให้เสถียร
const BEARING_OFFSET = 90;   // ถ้าแนวเส้นเพี้ยน ลอง 0 / 90 / -90

const SHOW_NEAREST_INFO = true;
const SHOW_USER_MARKER = false; // เปิดเป็น true ถ้าอยากเห็นกล่องแดงตำแหน่งผู้ใช้
/* ======================= */

const root = document.getElementById("root");
const msg  = document.getElementById("msg");

let userLat = null, userLon = null;
let isDrawn = false;

// ---------- GPS ----------
navigator.geolocation.watchPosition(
  (pos)=>{
    userLat = pos.coords.latitude;
    userLon = pos.coords.longitude;
    msg.textContent =
      `GPS พร้อม\nlat: ${userLat.toFixed(6)}\nlon: ${userLon.toFixed(6)}\naccuracy: ${Math.round(pos.coords.accuracy)} m\n` +
      `แนะนำ: กลางแจ้ง + Precise Location`;
  },
  (err)=>{
    msg.textContent =
      `❌ GPS ใช้งานไม่ได้\n${err.message}\n` +
      `ไปที่ Settings > Location Services > Safari > Precise Location`;
  },
  { enableHighAccuracy:true, maximumAge:0, timeout:20000 }
);

// ---------- Utils ----------
function clearScene(){
  while (root.firstChild) root.removeChild(root.firstChild);
}

function distMeters(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d*Math.PI/180;
  const dLat = toRad(lat2-lat1);
  const dLon = toRad(lon2-lon1);
  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function bearingDeg(lat1, lon1, lat2, lon2){
  const toRad = d => d*Math.PI/180;
  const toDeg = r => r*180/Math.PI;
  const y = Math.sin(toRad(lon2-lon1))*Math.cos(toRad(lat2));
  const x =
    Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) -
    Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lon2-lon1));
  return (toDeg(Math.atan2(y,x))+360)%360;
}

// ✅ ทดสอบตำแหน่งผู้ใช้ (กล่องแดง)
function addUserMarker(){
  if (userLat === null || userLon === null) return;
  const e = document.createElement("a-entity");
  e.setAttribute("gps-entity-place", `latitude: ${userLat.toFixed(7)}; longitude: ${userLon.toFixed(7)};`);

  const b = document.createElement("a-box");
  b.setAttribute("position", "0 1 0");
  b.setAttribute("color", "red");
  b.setAttribute("width", "0.6");
  b.setAttribute("height", "0.6");
  b.setAttribute("depth", "0.6");

  e.appendChild(b);
  root.appendChild(e);
}

// ✅ วาดเส้นถนน (segment)
function addSegment(lat1, lon1, lat2, lon2){
  const midLat = (lat1 + lat2) / 2;
  const midLon = (lon1 + lon2) / 2;

  const len = distMeters(lat1, lon1, lat2, lon2);
  const brg = bearingDeg(lat1, lon1, lat2, lon2) + BEARING_OFFSET;

  const e = document.createElement("a-entity");

  // ⭐ FIX สำคัญ: ฟอร์แมตนี้ AR.js อ่านได้ชัวร์ (ไม่ซ้อนจุดเดียว)
  e.setAttribute(
    "gps-entity-place",
    `latitude: ${midLat.toFixed(7)}; longitude: ${midLon.toFixed(7)};`
  );

  const box = document.createElement("a-box");
  box.setAttribute("width", SEG_THICK);
  box.setAttribute("height", SEG_HEIGHT);
  box.setAttribute("depth", Math.max(1, len));

  // ยกเส้นให้ลอยจากพื้น (กันพื้นกิน/กันปื้น)
  box.setAttribute("position", `0 ${SEG_HEIGHT} 0`);
  box.setAttribute("color", "#ffffff");

  // นอนเส้นลงพื้น
  box.setAttribute("rotation", `-90 ${brg} 0`);

  e.appendChild(box);
  root.appendChild(e);
}

// ---------- Load + Draw ----------
async function drawFile(file){
  if (isDrawn){
    msg.textContent += `\n\n(เส้นถูกวาดแล้ว) ถ้าจะวาดใหม่ให้กด “ล้าง” ก่อน`;
    return;
  }

  clearScene();

  if (userLat === null || userLon === null){
    msg.textContent += "\n\nรอ GPS ก่อน (ยังไม่รู้ตำแหน่งปัจจุบัน)";
    return;
  }

  const url = `./data/${file}`;
  msg.textContent += `\n\nกำลังโหลด: ${url}`;

  const res = await fetch(url);
  if (!res.ok){
    msg.textContent += `\n\n❌ โหลดไฟล์ไม่สำเร็จ (HTTP ${res.status})\nตรวจว่าไฟล์อยู่ใน data/ และชื่อไฟล์ตรง`;
    return;
  }

  const gj = await res.json();
  const feats = gj.features || [];
  msg.textContent += `\nโหลดสำเร็จ: features=${feats.length}`;

  if (SHOW_USER_MARKER) addUserMarker();

  // DEBUG: ใกล้ถนนที่สุด
  if (SHOW_NEAREST_INFO){
    let nearest = Infinity;
    let nearestName = "";
    for (const f of feats){
      if (!f.geometry || f.geometry.type !== "Point") continue;
      const [lon, lat] = f.geometry.coordinates;
      const p = f.properties || {};
      const d = distMeters(userLat, userLon, lat, lon);
      if (d < nearest){
        nearest = d;
        nearestName = p.road_name || p.road_key || "";
      }
    }
    if (nearest < Infinity){
      msg.textContent += `\nใกล้ถนนที่สุด: ${Math.round(nearest)} m\n${nearestName}`;
    } else {
      msg.textContent += `\n❌ ไม่พบ Point ในไฟล์นี้`;
    }
  }

  // group by road_key แล้วเรียง pt_i
  const byRoad = new Map();
  for (const f of feats){
    if (!f.geometry || f.geometry.type !== "Point") continue;
    const [lon, lat] = f.geometry.coordinates;
    const p = f.properties || {};
    const key = p.road_key || p.road_name || "road";
    const pt_i = Number(p.pt_i ?? 0);
    if (!byRoad.has(key)) byRoad.set(key, []);
    byRoad.get(key).push({lat, lon, pt_i});
  }

  let count = 0;
  let roads = 0;

  for (const pts of byRoad.values()){
    roads++;
    pts.sort((a,b)=>a.pt_i - b.pt_i);

    for (let i=0; i<pts.length - DRAW_EVERY; i += DRAW_EVERY){
      if (count >= MAX_SEGMENTS) break;

      const a = pts[i], b = pts[i + DRAW_EVERY];

      // วาดเฉพาะรอบตัว
      const midLat = (a.lat + b.lat) / 2;
      const midLon = (a.lon + b.lon) / 2;
      const d = distMeters(userLat, userLon, midLat, midLon);
      if (d > MAX_RADIUS_M) continue;

      addSegment(a.lat, a.lon, b.lat, b.lon);
      count++;
    }
  }

  msg.textContent += `\nวาดเส้น: ${count} segments\nroads in file: ${roads}\nรัศมีแสดงผล: ${MAX_RADIUS_M} m`;
  isDrawn = true;
}

// ---------- Buttons ----------
document.getElementById("load").onclick = ()=>{
  const f = document.getElementById("dataset").value;
  if (!f) { msg.textContent += "\n\nกรุณาเลือกอำเภอ"; return; }
  drawFile(f);
};

document.getElementById("clear").onclick = ()=>{
  clearScene();
  isDrawn = false;
  msg.textContent += "\n\nล้างแล้ว";
};
</script>

</body>
</html>
