<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Road Viewer (Data Folder Version)</title>

    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui { position: fixed; top: 10px; left: 10px; right: 10px; z-index: 9999; background: rgba(0,0,0,.85); color: #fff; padding: 15px; border-radius: 12px; font-size: 14px; }
        select, button { font-size: 14px; padding: 8px; margin-top: 8px; width: 100%; border-radius: 5px; border: none; }
        button { background: #3498db; color: white; font-weight: bold; cursor: pointer; }
        #msg { margin-top: 10px; white-space: pre-line; color: #00ff00; font-family: monospace; font-size: 11px; }
        .sim-btn { background: #e67e22; margin-top: 5px; }
    </style>
</head>

<body>

<div id="ui">
    <b>📍 ระบบ AR ถนน (Data Folder)</b><br/>
    เลือกไฟล์ในโฟลเดอร์ /data:
    <select id="dataset">
        <option value="">-- กรุณาเลือก --</option>
        <option value="roads_ar_points_อำเภอเมืองอุทัยธานี.geojson">อำเภอเมืองอุทัยธานี</option>
        <option value="roads_ar_points_อำเภอบ้านไร่.geojson">อำเภอบ้านไร่</option>
        <option value="roads_ar_points_อำเภอหนองฉาง.geojson">อำเภอหนองฉาง</option>
        <option value="roads_ar_points_อำเภอลานสัก.geojson">อำเภอลานสัก</option>
        <option value="roads_ar_points_อำเภอทัพทัน.geojson">อำเภอทัพทัน</option>
        <option value="roads_ar_points_อำเภอสว่างอารมณ์.geojson">อำเภอสว่างอารมณ์</option>
        <option value="roads_ar_points_อำเภอห้วยคต.geojson">อำเภอห้วยคต</option>
        <option value="roads_ar_points_อำเภอหนองขาหย่าง.geojson">อำเภอหนองขาหย่าง</option>
    </select>
    <button id="load">🚀 โหลดข้อมูลถนน</button>
    <button class="sim-btn" id="simulate">🏠 จำลองตำแหน่ง (อุทัยธานี)</button>
    <div id="msg">รอสัญญาณ GPS...</div>
</div>

<a-scene
    embedded
    vr-mode-ui="enabled:false"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
>
    <a-box position="0 1.6 -5" color="purple" scale="0.5 0.5 0.5"></a-box>
    
    <a-entity id="main-camera" gps-camera rotation-reader></a-entity>
    <a-entity id="root"></a-entity>
</a-scene>

<script>
/* CONFIG */
const SEG_THICK = 0.6;    
const SEG_HEIGHT = 0.3;   
const MAX_RADIUS_M = 3000; 

const root = document.getElementById("root");
const msg = document.getElementById("msg");
let userLat = null, userLon = null;

// GPS Tracking
navigator.geolocation.watchPosition((pos) => {
    userLat = pos.coords.latitude;
    userLon = pos.coords.longitude;
    msg.textContent = `GPS: ${userLat.toFixed(5)}, ${userLon.toFixed(5)} (±${Math.round(pos.coords.accuracy)}m)`;
}, (err) => {
    msg.textContent = `❌ GPS Error: ${err.message}`;
}, { enableHighAccuracy: true });

function distMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
}

function bearingDeg(lat1, lon1, lat2, lon2) {
    const toRad = d => d * Math.PI / 180;
    const toDeg = r => r * 180 / Math.PI;
    const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
    const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2-lon1));
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

function addSegment(lat1, lon1, lat2, lon2) {
    const midLat = (lat1 + lat2) / 2;
    const midLon = (lon1 + lon2) / 2;
    const len = distMeters(lat1, lon1, lat2, lon2);
    const brg = bearingDeg(lat1, lon1, lat2, lon2);

    const container = document.createElement("a-entity");
    container.setAttribute("gps-entity-place", `latitude: ${midLat.toFixed(7)}; longitude: ${midLon.toFixed(7)};`);

    const line = document.createElement("a-box");
    line.setAttribute("width", SEG_THICK);
    line.setAttribute("height", 0.1); 
    line.setAttribute("depth", len);
    line.setAttribute("position", `0 ${SEG_HEIGHT} 0`);
    line.setAttribute("rotation", `0 ${brg} 0`);
    line.setAttribute("color", "#F1C40F"); // สีเหลืองทองเพื่อให้ตัดกับถนนสีดำ

    container.appendChild(line);
    root.appendChild(container);
}

async function loadData(filename) {
    if (!userLat) { alert("รอ GPS หรือกดปุ่มจำลองพิกัดก่อนครับ"); return; }
    
    root.innerHTML = ""; 
    msg.textContent = `กำลังโหลด: ./data/${filename}`;

    try {
        // เปลี่ยนกลับมาใช้ path ./data/ พร้อมจัดการชื่อไฟล์ภาษาไทย
        const url = `./data/${encodeURIComponent(filename)}`;
        const res = await fetch(url);
        
        if (!res.ok) throw new Error(`ไม่พบไฟล์ที่ ./data/${filename} (HTTP ${res.status})`);
        
        const data = await res.json();
        const feats = data.features || [];
        
        const byRoad = new Map();
        feats.forEach(f => {
            const [lon, lat] = f.geometry.coordinates;
            const p = f.properties || {};
            const key = p.road_key || p.road_name || "road";
            if (!byRoad.has(key)) byRoad.set(key, []);
            byRoad.get(key).push({lat, lon, pt_i: Number(p.pt_i || 0)});
        });

        let count = 0;
        byRoad.forEach(pts => {
            pts.sort((a, b) => a.pt_i - b.pt_i);
            for (let i = 0; i < pts.length - 1; i++) {
                const d = distMeters(userLat, userLon, pts[i].lat, pts[i].lon);
                if (d < MAX_RADIUS_M) {
                    addSegment(pts[i].lat, pts[i].lon, pts[i+1].lat, pts[i+1].lon);
                    count++;
                }
            }
        });

        msg.textContent = `✅ โหลดสำเร็จ: ${count} segments\nใช้พิกัดจากไฟล์ใน /data/`;
    } catch (err) {
        msg.textContent = `❌ Error: ${err.message}`;
        console.error(err);
    }
}

document.getElementById("load").onclick = () => {
    const f = document.getElementById("dataset").value;
    if (f) loadData(f);
};

document.getElementById("simulate").onclick = () => {
    userLat = 15.36257;
    userLon = 100.01436;
    const cam = document.getElementById("main-camera");
    cam.setAttribute("gps-camera", `simulateLatitude: ${userLat}; simulateLongitude: ${userLon};`);
    msg.textContent = "⚠️ จำลองตำแหน่งที่: เมืองอุทัยธานี\nพร้อมโหลดไฟล์จาก ./data/";
};
</script>
</body>
</html>
