<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AR ถนนตามอำเภอ (DEBUG)</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>

<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
  }
  a-scene {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }
  #ui {
    position: fixed;
    top: 10px; left: 10px; right: 10px;
    z-index: 9999;
    background: rgba(0,0,0,.70);
    color: #fff;
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.4;
  }
  #ui select, #ui button {
    font-size: 14px;
    padding: 6px 10px;
    margin-top: 6px;
  }
  #msg { margin-top: 6px; white-space: pre-line; }
</style>
</head>

<body>

<div id="ui">
  <b>โหมด AR ถนนตามอำเภอ (DEBUG)</b><br/>
  เลือกอำเภอ/ชุดข้อมูล:
  <br/>
  <select id="dataset">
    <option value="">-- เลือก --</option>

    <!-- กลุ่มหลัก -->
    <option value="roads_ar_points_อำเภอเมืองอุทัยธานี.geojson">อำเภอเมืองอุทัยธานี</option>
    <option value="roads_ar_points_อำเภอบ้านไร่.geojson">อำเภอบ้านไร่</option>
    <option value="roads_ar_points_อำเภอหนองฉาง.geojson">อำเภอหนองฉาง</option>
    <option value="roads_ar_points_อำเภอลานสัก.geojson">อำเภอลานสัก</option>
    <option value="roads_ar_points_อำเภอทัพทัน.geojson">อำเภอทัพทัน</option>
    <option value="roads_ar_points_อำเภอสว่างอารมณ์.geojson">อำเภอสว่างอารมณ์</option>
    <option value="roads_ar_points_อำเภอห้วยคต.geojson">อำเภอห้วยคต</option>
    <option value="roads_ar_points_อำเภอหนองขาหย่าง.geojson">อำเภอหนองขาหย่าง</option>

    <!-- ชุดหลุด/พิเศษ -->
    <option value="roads_ar_points_หนองขาหย่าง.geojson">หนองขาหย่าง (ชุดสั้น)</option>
    <option value="roads_ar_points_หนองฉาง.geojson">หนองฉาง (ชุดสั้น)</option>
    <option value="roads_ar_points_อำเภอเมือง.geojson">อำเภอเมือง (ชุดสั้น)</option>
    <option value="roads_ar_points_เมือง.geojson">เมือง (ชุดสั้น)</option>
    <option value="roads_ar_points_จังหวัดสุพรรณบุรี.geojson">จังหวัดสุพรรณบุรี (ชุดหลุด)</option>
  </select>
  <br/>
  <button id="load">โหลดถนน</button>
  <button id="clear">ล้าง</button>

  <div id="msg">รออนุญาต Camera / Location…</div>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled: true"
  arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
>
  <a-entity gps-camera rotation-reader></a-entity>
  <a-entity id="root"></a-entity>
</a-scene>

<script>
/* =======================
   CONFIG (DEBUG MODE)
   ตั้งให้ "เห็นแน่" ก่อน
======================= */
const DEBUG_NEAREST = true;

// เส้นให้เห็นกลางแดด
const SEG_THICK = 0.35;
const SEG_HEIGHT = 0.12;

// วาดถี่ขึ้น
const DRAW_EVERY = 1;

// ขยายรัศมีชั่วคราวเพื่อเช็กว่ามีข้อมูลใกล้ไหม
const MAX_RADIUS_M = 6000;

// กันค้าง
const MAX_SEGMENTS = 3000;

// ทิศทางเส้น (ถ้าไม่ตรงค่อยลอง 0 / 90 / -90)
const BEARING_OFFSET = 90;

// ป้าย (ปิดไว้ก่อนให้ลื่น)
const ENABLE_LABELS = false;
const LABEL_EVERY_N = 25;
/* ======================= */

const root = document.getElementById("root");
const msg  = document.getElementById("msg");

let userLat = null, userLon = null;

// ---------- GPS ----------
navigator.geolocation.watchPosition(
  (pos)=>{
    userLat = pos.coords.latitude;
    userLon = pos.coords.longitude;
    msg.textContent =
      `GPS พร้อม\nlat: ${userLat.toFixed(6)}\nlon: ${userLon.toFixed(6)}\naccuracy: ${Math.round(pos.coords.accuracy)} m\nแนะนำ: กลางแจ้ง + Precise Location`;
  },
  (err)=>{
    msg.textContent =
      `❌ GPS ใช้งานไม่ได้\n${err.message}\nไปที่ Settings > Location Services > Safari > Precise Location`;
  },
  { enableHighAccuracy:true, maximumAge:0, timeout:20000 }
);

// ---------- Utils ----------
function clearScene(){
  while (root.firstChild) root.removeChild(root.firstChild);
}

function distMeters(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d*Math.PI/180;
  const dLat = toRad(lat2-lat1);
  const dLon = toRad(lon2-lon1);
  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function bearingDeg(lat1, lon1, lat2, lon2){
  const toRad = d => d*Math.PI/180;
  const toDeg = r => r*180/Math.PI;
  const y = Math.sin(toRad(lon2-lon1))*Math.cos(toRad(lat2));
  const x =
    Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) -
    Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lon2-lon1));
  return (toDeg(Math.atan2(y,x))+360)%360;
}

function addSegment(lat1, lon1, lat2, lon2){
  const midLat = (lat1+lat2)/2;
  const midLon = (lon1+lon2)/2;

  const len = distMeters(lat1,lon1,lat2,lon2);
  const brg = bearingDeg(lat1,lon1,lat2,lon2) + BEARING_OFFSET;

  const e = document.createElement("a-entity");
  e.setAttribute("gps-entity-place", `latitude:${midLat}; longitude:${midLon}`);

  const box = document.createElement("a-box");
  box.setAttribute("width", SEG_THICK);
  box.setAttribute("height", SEG_HEIGHT);
  box.setAttribute("depth", Math.max(1, len));
  box.setAttribute("position", `0 ${SEG_HEIGHT/2} 0`);
  box.setAttribute("color", "#ffffff");

  // ⭐ FIX: ทำให้เส้นนอนบนพื้น
  box.setAttribute("rotation", `-90 ${brg} 0`);

  e.appendChild(box);
  root.appendChild(e);
  return e;
}

function addLabel(ent, props){
  const bg = document.createElement("a-plane");
  bg.setAttribute("width", "4.8");
  bg.setAttribute("height", "2.0");
  bg.setAttribute("position", "0 2.3 0");
  bg.setAttribute("color", "#000");
  bg.setAttribute("opacity", "0.55");

  const t = document.createElement("a-text");
  t.setAttribute("value",
    `ถนน (แสดงผล)\n${props.road_name || "—"}\n` +
    `ราคาใหม่(ST_New): ${props.price_new ?? "—"}\n` +
    `กว้าง(ม.): ${props.width_m ?? "—"}\n` +
    `สาขา: ${props.office || "—"}`
  );
  t.setAttribute("position", "0 2.3 0.02");
  t.setAttribute("align", "center");
  t.setAttribute("width", "7.0");
  t.setAttribute("color", "#fff");

  ent.appendChild(bg);
  ent.appendChild(t);
}

// ---------- Load + Draw ----------
async function drawFile(file){
  clearScene();

  if (userLat === null || userLon === null){
    msg.textContent += "\n\nรอ GPS ก่อน (ยังไม่รู้ตำแหน่งปัจจุบัน)";
    return;
  }

  const url = `./data/${file}`;
  msg.textContent += `\n\nกำลังโหลด: ${url}`;

  const res = await fetch(url);
  if (!res.ok){
    msg.textContent += `\n\n❌ HTTP ${res.status} โหลดไม่ได้: ${url}\nตรวจว่าไฟล์อยู่ใน data/ และชื่อไฟล์ตรง`;
    return;
  }

  const gj = await res.json();
  const feats = gj.features || [];
  msg.textContent += `\nโหลดสำเร็จ: features=${feats.length}`;

  // DEBUG: หา "จุดถนนที่ใกล้ที่สุด"
  if (DEBUG_NEAREST){
    let nearest = Infinity;
    let nearestName = "";
    for (const f of feats){
      if (!f.geometry || f.geometry.type !== "Point") continue;
      const [lon, lat] = f.geometry.coordinates;
      const p = f.properties || {};
      const d = distMeters(userLat, userLon, lat, lon);
      if (d < nearest){
        nearest = d;
        nearestName = p.road_name || p.road_key || "";
      }
    }
    if (nearest < Infinity){
      msg.textContent += `\n\nใกล้ถนนที่สุด: ${Math.round(nearest)} m\n${nearestName}`;
    } else {
      msg.textContent += `\n\n❌ ไม่พบจุด Point ในไฟล์นี้`;
    }
  }

  // group by road_key แล้วเรียง pt_i
  const byRoad = new Map();
  for (const f of feats){
    if (!f.geometry || f.geometry.type !== "Point") continue;
    const [lon, lat] = f.geometry.coordinates;
    const p = f.properties || {};
    const key = p.road_key || p.road_name || "road";
    const pt_i = Number(p.pt_i ?? 0);
    if (!byRoad.has(key)) byRoad.set(key, []);
    byRoad.get(key).push({lat, lon, pt_i, props: p});
  }

  let count = 0;
  let roads = 0;

  for (const pts of byRoad.values()){
    roads++;
    pts.sort((a,b)=>a.pt_i - b.pt_i);

    let segCountThisRoad = 0;

    for (let i=0; i<pts.length - DRAW_EVERY; i += DRAW_EVERY){
      if (count >= MAX_SEGMENTS) break;

      const a = pts[i], b = pts[i + DRAW_EVERY];

      // วาดเฉพาะรอบตัว
      const midLat = (a.lat + b.lat) / 2;
      const midLon = (a.lon + b.lon) / 2;
      const d = distMeters(userLat, userLon, midLat, midLon);
      if (d > MAX_RADIUS_M) continue;

      const ent = addSegment(a.lat, a.lon, b.lat, b.lon);
      count++;
      segCountThisRoad++;

      if (ENABLE_LABELS && (segCountThisRoad % LABEL_EVERY_N === 1)){
        addLabel(ent, a.props);
      }
    }
  }

  msg.textContent += `\n\nวาดเส้น: ${count} segments\nroads in file: ${roads}\nรัศมี: ${MAX_RADIUS_M} m (DEBUG)`;
}

// Buttons
document.getElementById("load").onclick = ()=>{
  const f = document.getElementById("dataset").value;
  if (!f) { msg.textContent += "\n\nกรุณาเลือกอำเภอ"; return; }
  drawFile(f);
};
document.getElementById("clear").onclick = ()=>{
  clearScene();
  msg.textContent += "\n\nล้างแล้ว";
};
</script>

</body>
</html>
