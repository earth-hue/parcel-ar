<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR ถนนตามอำเภอ (Stable)</title>

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>

  <!-- ===== CSS กันพื้นขาว / กัน Safari เพี้ยน ===== -->
  <style>
    html, body {
      margin:0; padding:0;
      width:100%; height:100%;
      overflow:hidden;
      background:#000;
      font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;
    }
    a-scene {
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
    }
    #ui {
      position:fixed;
      top:10px; left:10px; right:10px;
      z-index:9999;
      background:rgba(0,0,0,0.65);
      color:#fff;
      padding:10px 12px;
      border-radius:12px;
      font-size:14px;
      line-height:1.35;
    }
    #ui select, #ui button {
      font-size:14px;
      padding:6px 10px;
      margin-top:6px;
    }
    #msg {
      margin-top:6px;
      white-space:pre-line;
      font-size:13px;
    }
  </style>
</head>

<body>
  <!-- ===== UI ===== -->
  <div id="ui">
    <b>โหมด AR ถนนตามอำเภอ</b><br/>

    เลือกอำเภอ/ชุดข้อมูล:<br/>
    <select id="aum">
      <option value="">-- เลือก --</option>
      <option value="roads_ar_points_อำเภอเมืองอุทัยธานี.geojson">อำเภอเมืองอุทัยธานี</option>
      <option value="roads_ar_points_อำเภอบ้านไร่.geojson">อำเภอบ้านไร่</option>
      <option value="roads_ar_points_อำเภอหนองฉาง.geojson">อำเภอหนองฉาง</option>
      <option value="roads_ar_points_อำเภอลานสัก.geojson">อำเภอลานสัก</option>
      <option value="roads_ar_points_อำเภอทัพทัน.geojson">อำเภอทัพทัน</option>
      <option value="roads_ar_points_อำเภอสว่างอารมณ์.geojson">อำเภอสว่างอารมณ์</option>
      <option value="roads_ar_points_อำเภอหนองขาหย่าง.geojson">อำเภอหนองขาหย่าง</option>
      <option value="roads_ar_points_อำเภอห้วยคต.geojson">อำเภอห้วยคต</option>
    </select><br/>

    <button id="load">โหลดถนน</button>
    <button id="clear">ล้าง</button>

    <div id="msg">รออนุญาตกล้องและตำแหน่ง…</div>
  </div>

  <!-- ===== AR Scene ===== -->
  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="alpha:true; antialias:true;"
    background="transparent:true"
    arjs="sourceType:webcam; debugUIEnabled:false;"
  >
    <a-entity gps-camera rotation-reader></a-entity>
    <a-entity id="root"></a-entity>
  </a-scene>

  <!-- ===== JavaScript ===== -->
  <script>
    /* =========================
       ปรับค่าหลัก (สำคัญ)
    ========================== */
    const SEG_THICK = 0.12;       // ความหนาเส้น (เมตร AR)
    const SEG_HEIGHT = 0.04;      // ความสูงเส้น
    const DRAW_EVERY = 2;         // เชื่อมข้ามจุด (ลดภาระ)
    const BEARING_OFFSET = 90;    // ถ้าเส้นเอียงผิด ลอง 0 / -90
    const MAX_RADIUS_M = 1200;    // วาดเฉพาะในรัศมี 1.2 กม.
    const MAX_SEGMENTS = 2200;    // กัน Safari พัง
    /* ========================= */

    const root = document.getElementById("root");
    const msg = document.getElementById("msg");

    let userLat = null, userLon = null;

    // ===== GPS =====
    function fmt(n){ return (typeof n==="number") ? n.toFixed(6) : "—"; }

    navigator.geolocation.watchPosition(
      (pos)=>{
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        msg.textContent =
          `GPS พร้อมแล้ว\nlat: ${fmt(userLat)}\nlon: ${fmt(userLon)}\naccuracy: ${Math.round(pos.coords.accuracy)} m\n` +
          `คำแนะนำ: กลางแจ้ง + Precise Location`;
      },
      (err)=>{
        msg.textContent =
          `❌ ใช้ตำแหน่งไม่ได้: ${err.message}\n` +
          `Settings > Location Services > Safari > Precise Location`;
      },
      { enableHighAccuracy:true, maximumAge:0, timeout:20000 }
    );

    // ===== Utils =====
    function clearScene(){
      while (root.firstChild) root.removeChild(root.firstChild);
    }

    async function loadGeojson(filename){
      const res = await fetch(`./data/${filename}`);
      if (!res.ok) throw new Error("โหลดไฟล์ไม่สำเร็จ");
      return await res.json();
    }

    function distMeters(lat1, lon1, lat2, lon2){
      const R = 6371000;
      const toRad = d => d*Math.PI/180;
      const dLat = toRad(lat2-lat1);
      const dLon = toRad(lon2-lon1);
      const a = Math.sin(dLat/2)**2 +
                Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*
                Math.sin(dLon/2)**2;
      return 2*R*Math.asin(Math.sqrt(a));
    }

    function bearingDeg(lat1, lon1, lat2, lon2){
      const toRad = d => d*Math.PI/180;
      const toDeg = r => r*180/Math.PI;
      const y = Math.sin(toRad(lon2-lon1))*Math.cos(toRad(lat2));
      const x = Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) -
                Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lon2-lon1));
      let b = toDeg(Math.atan2(y,x));
      return (b+360)%360;
    }

    function addSegment(lat1, lon1, lat2, lon2){
      const midLat = (lat1+lat2)/2;
      const midLon = (lon1+lon2)/2;
      const len = distMeters(lat1,lon1,lat2,lon2);
      const brg = bearingDeg(lat1,lon1,lat2,lon2) + BEARING_OFFSET;

      const e = document.createElement("a-entity");
      e.setAttribute("gps-entity-place", `latitude:${midLat}; longitude:${midLon};`);

      const box = document.createElement("a-box");
      box.setAttribute("width", SEG_THICK);
      box.setAttribute("height", SEG_HEIGHT);
      box.setAttribute("depth", Math.max(1,len));
      box.setAttribute("position", `0 ${SEG_HEIGHT/2} 0`);
      box.setAttribute("rotation", `0 ${brg} 0`);
      box.setAttribute("color", "#ffffff");

      e.appendChild(box);
      root.appendChild(e);
    }

    // ===== Draw =====
    async function drawFile(filename){
      clearScene();
      const gj = await loadGeojson(filename);

      const byRoad = new Map();
      for (const f of gj.features){
        if (!f.geometry || f.geometry.type!=="Point") continue;
        const [lon,lat] = f.geometry.coordinates;
        const p = f.properties || {};
        const key = p.road_key || p.road_name || "X";
        const i = Number(p.pt_i||0);
        if (!byRoad.has(key)) byRoad.set(key,[]);
        byRoad.get(key).push({lat,lon,i});
      }

      let segTotal = 0;
      for (const pts of byRoad.values()){
        pts.sort((a,b)=>a.i-b.i);
        for (let i=0;i<pts.length-DRAW_EVERY;i+=DRAW_EVERY){
          if (segTotal>=MAX_SEGMENTS) break;
          if (userLat===null) continue;

          const a=pts[i], b=pts[i+DRAW_EVERY];
          const midLat=(a.lat+b.lat)/2, midLon=(a.lon+b.lon)/2;
          if (distMeters(userLat,userLon,midLat,midLon)>MAX_RADIUS_M) continue;

          addSegment(a.lat,a.lon,b.lat,b.lon);
          segTotal++;
        }
      }

      msg.textContent += `\n\nโหลดแล้ว: ${filename}\nSegments: ${segTotal}`;
    }

    // ===== UI events =====
    document.getElementById("load").onclick = async ()=>{
      const f = document.getElementById("aum").value;
      if (!f) { msg.textContent += "\nกรุณาเลือกอำเภอ"; return; }
      try { await drawFile(f); }
      catch(e){ msg.textContent += "\n❌ "+e.message; }
    };

    document.getElementById("clear").onclick = ()=>{
      clearScene();
      msg.textContent += "\nล้างแล้ว";
    };
  </script>
</body>
</html>
