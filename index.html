<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AR ถนนราคาประเมิน (แสดงเป็นเส้น)</title>

<!-- A-Frame + AR.js -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
  }
  a-scene {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #ui {
    position: fixed;
    top: 10px; left: 10px; right: 10px;
    z-index: 9999;
    background: rgba(0,0,0,.65);
    color: #fff;
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.4;
  }
  #ui select, #ui button {
    font-size: 14px;
    padding: 6px 10px;
    margin-top: 6px;
  }
  #msg { margin-top: 6px; white-space: pre-line; }
</style>
</head>

<body>

<div id="ui">
  <b>โหมด AR ถนนตามอำเภอ (เส้นถนน)</b><br/>
  เลือกอำเภอ:
  <br/>
  <select id="dataset">
    <option value="">-- เลือก --</option>
    <option value="roads_ar_points_อำเภอเมืองอุทัยธานี.geojson">อำเภอเมืองอุทัยธานี</option>
    <option value="roads_ar_points_อำเภอบ้านไร่.geojson">อำเภอบ้านไร่</option>
    <option value="roads_ar_points_อำเภอหนองฉาง.geojson">อำเภอหนองฉาง</option>
    <option value="roads_ar_points_อำเภอลานสัก.geojson">อำเภอลานสัก</option>
    <option value="roads_ar_points_อำเภอทัพทัน.geojson">อำเภอทัพทัน</option>
    <option value="roads_ar_points_อำเภอสว่างอารมณ์.geojson">อำเภอสว่างอารมณ์</option>
    <option value="roads_ar_points_อำเภอห้วยคต.geojson">อำเภอห้วยคต</option>
    <option value="roads_ar_points_อำเภอหนองขาหย่าง.geojson">อำเภอหนองขาหย่าง</option>
  </select>
  <br/>
  <button id="load">โหลดถนน</button>
  <button id="clear">ล้าง</button>

  <div id="msg">รออนุญาต Camera / Location…</div>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  renderer="alpha:true; antialias:true"
  background="transparent:true"
  arjs="sourceType:webcam; debugUIEnabled:false;"
>
  <a-entity gps-camera rotation-reader></a-entity>
  <a-entity id="root"></a-entity>
</a-scene>

<script>
/* =======================
   CONFIG (ปรับได้)
======================= */
const SEG_THICK = 0.15;
const SEG_HEIGHT = 0.03;
const DRAW_EVERY = 2;
const MAX_RADIUS_M = 1200;
const MAX_SEGMENTS = 2000;
const BEARING_OFFSET = 90;

/* ======================= */
const root = document.getElementById("root");
const msg  = document.getElementById("msg");

let userLat = null, userLon = null;

/* GPS */
navigator.geolocation.watchPosition(
  (pos)=>{
    userLat = pos.coords.latitude;
    userLon = pos.coords.longitude;
    msg.textContent =
      `GPS พร้อม\nlat: ${userLat.toFixed(6)}\nlon: ${userLon.toFixed(6)}\naccuracy: ${Math.round(pos.coords.accuracy)} m\nแนะนำ: กลางแจ้ง + Precise Location`;
  },
  (err)=>{
    msg.textContent = "❌ GPS ใช้งานไม่ได้\n" + err.message;
  },
  { enableHighAccuracy:true, maximumAge:0, timeout:20000 }
);

/* Utils */
function clearScene(){
  while (root.firstChild) root.removeChild(root.firstChild);
}

function distMeters(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d*Math.PI/180;
  const dLat = toRad(lat2-lat1);
  const dLon = toRad(lon2-lon1);
  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function bearingDeg(lat1, lon1, lat2, lon2){
  const toRad = d => d*Math.PI/180;
  const toDeg = r => r*180/Math.PI;
  const y = Math.sin(toRad(lon2-lon1))*Math.cos(toRad(lat2));
  const x =
    Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) -
    Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lon2-lon1));
  return (toDeg(Math.atan2(y,x))+360)%360;
}

function addSegment(lat1, lon1, lat2, lon2){
  const midLat = (lat1+lat2)/2;
  const midLon = (lon1+lon2)/2;
  const len = distMeters(lat1,lon1,lat2,lon2);
  const brg = bearingDeg(lat1,lon1,lat2,lon2)+BEARING_OFFSET;

  const e = document.createElement("a-entity");
  e.setAttribute("gps-entity-place", `latitude:${midLat}; longitude:${midLon}`);

  const box = document.createElement("a-box");
  box.setAttribute("width", SEG_THICK);
  box.setAttribute("height", SEG_HEIGHT);
  box.setAttribute("depth", Math.max(1,len));
  box.setAttribute("position", `0 ${SEG_HEIGHT/2} 0`);
  box.setAttribute("color", "#ffffff");

  /* ⭐ FIX สำคัญ: นอนเส้นลงพื้น */
  box.setAttribute("rotation", `-90 ${brg} 0`);

  e.appendChild(box);
  root.appendChild(e);
}

/* Load + Draw */
async function drawFile(file){
  clearScene();
  const res = await fetch(`./data/${file}`);
  if (!res.ok) { msg.textContent += "\nโหลดไฟล์ไม่สำเร็จ"; return; }
  const gj = await res.json();

  const byRoad = new Map();
  for (const f of gj.features){
    if (!f.geometry || f.geometry.type!=="Point") continue;
    const [lon,lat] = f.geometry.coordinates;
    const p = f.properties || {};
    const key = p.road_key || p.road_name || "road";
    if (!byRoad.has(key)) byRoad.set(key,[]);
    byRoad.get(key).push({lat,lon,pt_i:p.pt_i||0});
  }

  let count = 0;
  for (const pts of byRoad.values()){
    pts.sort((a,b)=>a.pt_i-b.pt_i);
    for (let i=0;i<pts.length-DRAW_EVERY;i+=DRAW_EVERY){
      if (count>=MAX_SEGMENTS) break;
      if (userLat===null) continue;
      const a=pts[i], b=pts[i+DRAW_EVERY];
      const d = distMeters(userLat,userLon,(a.lat+b.lat)/2,(a.lon+b.lon)/2);
      if (d>MAX_RADIUS_M) continue;
      addSegment(a.lat,a.lon,b.lat,b.lon);
      count++;
    }
  }
  msg.textContent += `\nแสดงเส้น: ${count}`;
}

/* Buttons */
document.getElementById("load").onclick = ()=>{
  const f = document.getElementById("dataset").value;
  if (!f) return;
  drawFile(f);
};
document.getElementById("clear").onclick = clearScene;

</script>
</body>
</html>
