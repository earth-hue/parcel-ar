<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Road Viewer - Uthai Thani Project</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js" crossorigin="anonymous"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui { position: fixed; top: 10px; left: 10px; right: 10px; z-index: 9999; background: rgba(0,0,0,.85); color: #fff; padding: 15px; border-radius: 12px; }
        select, button { font-size: 14px; padding: 10px; margin-top: 8px; width: 100%; border-radius: 8px; border: none; }
        button { background: #27ae60; color: white; font-weight: bold; }
        #msg { margin-top: 10px; white-space: pre-line; color: #f1c40f; font-family: monospace; font-size: 11px; }
    </style>
</head>

<body>
<div id="ui">
    <b>📍 ระบบ AR ถนน: ธนารักษ์เอื้อราษฏร์ยั่งยืน</b><br/>
    <select id="dataset">
        <option value="">-- เลือกอำเภอ --</option>
        <option value="roads_ar_points_อำเภอเมืองอุทัยธานี.geojson">อำเภอเมืองอุทัยธานี</option>
        <option value="roads_ar_points_อำเภอหนองฉาง.geojson">อำเภอหนองฉาง</option>
        <option value="roads_ar_points_อำเภอทัพทัน.geojson">อำเภอทัพทัน</option>
        <option value="roads_ar_points_อำเภอบ้านไร่.geojson">อำเภอบ้านไร่</option>
    </select>
    <button id="load">🚀 แสดงเส้นถนน AR</button>
    <div id="msg">รอสัญญาณ GPS แม่นยำ...</div>
</div>

<a-scene
    embedded
    vr-mode-ui="enabled:false"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
>
    <a-entity id="main-camera" gps-camera="enableHighAccuracy: true; minDistance: 1;" rotation-reader></a-entity>
    <a-entity id="root"></a-entity>
</a-scene>

<script>
// ปรับค่าเพื่อให้เส้นถนน "วางบนพื้น" จริงๆ
const SEG_THICK = 0.8;    // หนาขึ้นเพื่อให้เห็นชัด
const SEG_HEIGHT = 0.1;   // ลดความสูงลงให้เกือบติดพื้น (แก้ปัญหาสายตา)
const MAX_RADIUS_M = 1000; // จำกัดรัศมี 1 กม. เพื่อลดการซ้อนทับ

const root = document.getElementById("root");
const msg = document.getElementById("msg");
let userLat = null, userLon = null;

navigator.geolocation.watchPosition((pos) => {
    userLat = pos.coords.latitude;
    userLon = pos.coords.longitude;
    const acc = Math.round(pos.coords.accuracy);
    msg.textContent = `พิกัด: ${userLat.toFixed(5)}, ${userLon.toFixed(5)}\nความคลาดเคลื่อน: ±${acc}m`;
    
    // แจ้งเตือนหาก GPS ไม่แม่นยำ
    if (acc > 20) msg.textContent += "\n⚠️ สัญญาณต่ำ กรุณาย้ายไปที่โล่ง";
}, (err) => {
    msg.textContent = `❌ GPS Error: ${err.message}`;
}, { enableHighAccuracy: true, maximumAge: 0 });

function distMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
}

function bearingDeg(lat1, lon1, lat2, lon2) {
    const toRad = d => d * Math.PI / 180;
    const toDeg = r => r * 180 / Math.PI;
    const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
    const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2-lon1));
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

async function loadData(filename) {
    if (!userLat) return;
    root.innerHTML = ""; 
    msg.textContent = "กำลังประมวลผลข้อมูลภูมิสารสนเทศ...";

    try {
        const url = `./data/${encodeURIComponent(filename)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("โหลดไฟล์ GeoJSON ไม่สำเร็จ");
        const data = await res.json();
        
        const byRoad = new Map();
        data.features.forEach(f => {
            const [lon, lat] = f.geometry.coordinates;
            const p = f.properties || {};
            const key = p.road_key || p.road_name || "road";
            if (!byRoad.has(key)) byRoad.set(key, []);
            byRoad.get(key).push({lat, lon, pt_i: Number(p.pt_i || 0)});
        });

        let count = 0;
        byRoad.forEach(pts => {
            pts.sort((a, b) => a.pt_i - b.pt_i);
            for (let i = 0; i < pts.length - 1; i++) {
                const d = distMeters(userLat, userLon, pts[i].lat, pts[i].lon);
                if (d < MAX_RADIUS_M) {
                    const midLat = (pts[i].lat + pts[i+1].lat) / 2;
                    const midLon = (pts[i].lon + pts[i+1].lon) / 2;
                    const len = distMeters(pts[i].lat, pts[i].lon, pts[i+1].lat, pts[i+1].lon);
                    const brg = bearingDeg(pts[i].lat, pts[i].lon, pts[i+1].lat, pts[i+1].lon);

                    const el = document.createElement("a-entity");
                    el.setAttribute("gps-entity-place", `latitude: ${midLat.toFixed(7)}; longitude: ${midLon.toFixed(7)};`);
                    
                    const box = document.createElement("a-box");
                    box.setAttribute("width", SEG_THICK);
                    box.setAttribute("height", 0.05); // เส้นบางลงเพื่อลดการทับซ้อน
                    box.setAttribute("depth", len);
                    box.setAttribute("position", `0 ${SEG_HEIGHT} 0`);
                    box.setAttribute("rotation", `0 ${brg} 0`);
                    box.setAttribute("color", "#f1c40f"); // สีเหลืองทองธนารักษ์
                    
                    el.appendChild(box);
                    root.appendChild(el);
                    count++;
                }
            }
        });
        msg.textContent = `✅ แสดงผลถนน ${count} ช่วง ในรัศมี 1 กม.`;
    } catch (err) {
        msg.textContent = `❌ Error: ${err.message}`;
    }
}

document.getElementById("load").onclick = () => {
    const f = document.getElementById("dataset").value;
    if (f) loadData(f);
};
</script>
</body>
</html>
